# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish Images

# Publication channels:
# - Pushes to main build snapshots with best-effort branch tags
# - Releases use published assets
on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  # Prevent concurrent runs per event channel
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false
  queue: max

permissions: {}

env:
  IMAGE_NAME: ghcr.io/florianilch/lightpanda-gateway

jobs:
  publish-base:
    name: Publish base image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && github.event.release.tag_name != '') }}

    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      base_digest: ${{ steps.base.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Base image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-base
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}

      - name: Validate release tag
        # fail if metadata-action cannot determine the version tag for the release channel
        if: ${{ github.event_name == 'release' && format('v{0}', steps.meta.outputs.version) != format('{0}-base', github.event.release.tag_name) }}
        run: |
          echo "::error::Unsupported release tag or version"
          exit 1

      - name: Set up Go for branch
        if: ${{ github.event_name == 'push' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate branch module dependencies
        if: ${{ github.event_name == 'push' }}
        run: go mod tidy -diff && go mod verify

      - name: Build branch snapshot binaries
        if: ${{ github.event_name == 'push' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2.18'
          args: build --snapshot --clean

      - name: Prepare branch binary build contexts
        id: binaries-main
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail

          amd64="${GITHUB_WORKSPACE}/dist/lpgw_linux_amd64_v1"
          arm64="${GITHUB_WORKSPACE}/dist/lpgw_linux_arm64_v8.0"
          [[ -f "${amd64}/lpgw" && -x "${amd64}/lpgw" ]]
          [[ -f "${arm64}/lpgw" && -x "${arm64}/lpgw" ]]

          printf 'amd64=%s\n' "${amd64}" >> "${GITHUB_OUTPUT}"
          printf 'arm64=%s\n' "${arm64}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release binary build contexts
        id: binaries-release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          assets="${RUNNER_TEMP}/release-assets"
          mkdir -p "${assets}"

          gh release download "${EVENT_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${assets}"

          (cd "${assets}" && sha256sum --check --strict checksums.txt)

          contexts="${RUNNER_TEMP}/lpgw-contexts"

          shopt -s nullglob
          for arch in amd64 arm64; do
            archives=( "${assets}"/lpgw_*_linux_"${arch}".tar.gz )
            if (( ${#archives[@]} != 1 )); then
              printf '::error::Expected exactly one Linux %s archive, found %s\n' "${arch}" "${#archives[@]}"
              exit 1
            fi

            mkdir -p "${contexts}/linux/${arch}"
            tar -xzf "${archives[0]}" -C "${contexts}/linux/${arch}" lpgw
            [[ -f "${contexts}/linux/${arch}/lpgw" && -x "${contexts}/linux/${arch}/lpgw" ]]
          done

          printf 'amd64=%s\n' "${contexts}/linux/amd64" >> "${GITHUB_OUTPUT}"
          printf 'arm64=%s\n' "${contexts}/linux/arm64" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./docker/base.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            lpgw-amd64=${{ steps.binaries-main.outputs.amd64 || steps.binaries-release.outputs.amd64 }}
            lpgw-arm64=${{ steps.binaries-main.outputs.arm64 || steps.binaries-release.outputs.arm64 }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.created=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            org.opencontainers.image.revision=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            org.opencontainers.image.source=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.source'] }}
            org.opencontainers.image.url=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.url'] }}
            org.opencontainers.image.version=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          annotations: |
            index:org.opencontainers.image.description=A gateway for running Lightpanda workloads with process lifecycle and concurrency control.
          provenance: false
          sbom: true
          push: true

      - name: Attest base image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.base.outputs.digest }}

  publish-standalone:
    name: Publish standalone images
    needs: publish-base
    runs-on: ubuntu-latest

    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      standalone_digest: ${{ steps.standalone.outputs.digest }}
      standalone_distroless_digest: ${{ steps.standalone-distroless.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Standalone image metadata
        id: meta-standalone
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-standalone
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}

      - name: Distroless standalone image metadata
        id: meta-standalone-distroless
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-standalone-distroless
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standalone image
        id: standalone
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./docker/standalone.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_NAME }}@${{ needs.publish-base.outputs.base_digest }}
          tags: ${{ steps.meta-standalone.outputs.tags }}
          labels: |
            org.opencontainers.image.created=${{ fromJSON(steps.meta-standalone.outputs.json).labels['org.opencontainers.image.created'] }}
            org.opencontainers.image.revision=${{ fromJSON(steps.meta-standalone.outputs.json).labels['org.opencontainers.image.revision'] }}
            org.opencontainers.image.source=${{ fromJSON(steps.meta-standalone.outputs.json).labels['org.opencontainers.image.source'] }}
            org.opencontainers.image.url=${{ fromJSON(steps.meta-standalone.outputs.json).labels['org.opencontainers.image.url'] }}
            org.opencontainers.image.version=${{ fromJSON(steps.meta-standalone.outputs.json).labels['org.opencontainers.image.version'] }}
          annotations: |
            index:org.opencontainers.image.description=A gateway for running Lightpanda workloads with process lifecycle and concurrency control.
          provenance: false
          sbom: true
          push: true

      - name: Attest standalone image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.standalone.outputs.digest }}

      - name: Build and push distroless standalone image
        id: standalone-distroless
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./docker/standalone-distroless.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_NAME }}@${{ needs.publish-base.outputs.base_digest }}
          tags: ${{ steps.meta-standalone-distroless.outputs.tags }}
          labels: |
            org.opencontainers.image.created=${{ fromJSON(steps.meta-standalone-distroless.outputs.json).labels['org.opencontainers.image.created'] }}
            org.opencontainers.image.revision=${{ fromJSON(steps.meta-standalone-distroless.outputs.json).labels['org.opencontainers.image.revision'] }}
            org.opencontainers.image.source=${{ fromJSON(steps.meta-standalone-distroless.outputs.json).labels['org.opencontainers.image.source'] }}
            org.opencontainers.image.url=${{ fromJSON(steps.meta-standalone-distroless.outputs.json).labels['org.opencontainers.image.url'] }}
            org.opencontainers.image.version=${{ fromJSON(steps.meta-standalone-distroless.outputs.json).labels['org.opencontainers.image.version'] }}
          annotations: |
            index:org.opencontainers.image.description=A gateway for running Lightpanda workloads with process lifecycle and concurrency control.
          provenance: false
          sbom: true
          push: true

      - name: Attest distroless standalone image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.standalone-distroless.outputs.digest }}

  promote:
    name: Update stable tags
    needs: [publish-base, publish-standalone]
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stable tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          BASE_DIGEST: ${{ needs.publish-base.outputs.base_digest }}
          STANDALONE_DIGEST: ${{ needs.publish-standalone.outputs.standalone_digest }}
          STANDALONE_DISTROLESS_DIGEST: ${{ needs.publish-standalone.outputs.standalone_distroless_digest }}
        run: |
          set -euo pipefail

          if ! latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"; then
            echo "::error::Failed to query GitHub's latest release"
            exit 1
          fi
          if [[ "${latest_tag}" != "${EVENT_RELEASE_TAG}" ]]; then
            echo "::notice::Skipping stable aliases because this release is no longer GitHub's latest"
            exit 0
          fi

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:base" \
            "${IMAGE_NAME}@${BASE_DIGEST}"

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:standalone" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${STANDALONE_DIGEST}"

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:standalone-distroless" \
            "${IMAGE_NAME}@${STANDALONE_DISTROLESS_DIGEST}"
