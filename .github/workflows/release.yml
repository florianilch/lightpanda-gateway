name: Release

on:
  push:
    tags: [v*]

concurrency:
  # serialize runs for the same tag without blocking other releases
  group: ${{ github.workflow }}-${{ github.ref }}
  # do not terminate a release mid-upload
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write     # for attestation
      attestations: write # for attestation

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate module dependencies
        run: go mod tidy -diff && go mod verify

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '~> v2.18'
          args: release --verbose --clean --draft

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
